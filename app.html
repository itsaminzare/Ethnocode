<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EthnoCode Workspace</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23361a54'/%3E%3Crect x='7' y='9' width='18' height='5' rx='1' fill='%23993bff'/%3E%3Crect x='7' y='18' width='12' height='5' rx='1' fill='%23fafafa'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..500&display=swap">
<link rel="stylesheet" href="app.css">
<script>if(!('onpageswap' in window))document.documentElement.classList.add('vt-fallback')</script>
</head>
<body>
<header class="topbar">
  <a class="wordmark" href="index.html">EthnoCode</a>
  <nav class="tabs" aria-label="Workspace views">
    <button type="button" class="tab" data-action="view" data-view="notes" id="tab-notes">Notes</button>
    <button type="button" class="tab" data-action="view" data-view="codebook" id="tab-codebook">Codebook</button>
  </nav>
  <div class="top-right">
    <span class="saved" id="saved">Saved in this browser</span>
    <div id="account" class="account"></div>
  </div>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar" aria-label="Field notes"></aside>
  <main class="main" id="main" tabindex="-1"></main>
</div>

<dialog class="auth" id="authDialog" aria-labelledby="auth-title"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fileInput" accept=".txt,.md,.docx" multiple hidden>
<script src="app.js"></script>
</body>
</html>
